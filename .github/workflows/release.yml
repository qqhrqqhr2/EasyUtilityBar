name: Release EasyUtilityBar
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate addon and configure CurseForge
        env:
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          test -f EasyUtilityBar.toc
          test -f Core.lua
          test -f Locales/Locales.lua
          test -n "$CF_PROJECT_ID" || { echo "Missing CF_PROJECT_ID secret"; exit 1; }
          test -n "$CF_API_KEY" || { echo "Missing CF_API_KEY secret"; exit 1; }
          echo "## X-Curse-Project-ID: $CF_PROJECT_ID" >> EasyUtilityBar.toc
      - name: Publish GitHub release and CurseForge package
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
