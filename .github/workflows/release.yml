name: Release EasyUtilityBar
on:
  push:
    branches: [master]
    paths: ['CHANGELOG.md']
    tags:
      - 'v*'
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Branch run: tag the commit with the top CHANGELOG.md version, then re-run this
      # workflow on that tag. Packaging and upload only happen in the tag run.
      # Nothing happens if a GitHub release for that version already exists.
      - name: Create tag from CHANGELOG
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -d' ' -f2)
          [ -n "$ver" ] || { echo "No version found in CHANGELOG.md"; exit 1; }
          tag="v$ver"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to release."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a release - moving it to this commit."
            git push origin ":refs/tags/$tag"
          fi
          git tag -f "$tag"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
      - name: Validate addon and configure CurseForge
        if: github.ref_type == 'tag'
        env:
          CF_PROJECT_ID: '1741884'
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          test -f EasyUtilityBar.toc
          test -f Core.lua
          test -f Locales/Locales.lua
          test -n "$CF_API_KEY" || { echo "Missing CF_API_KEY secret"; exit 1; }
          echo "## X-Curse-Project-ID: $CF_PROJECT_ID" >> EasyUtilityBar.toc
      - name: Publish GitHub release and CurseForge package
        if: github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
